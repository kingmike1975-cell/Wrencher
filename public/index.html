<style>
/* Layout: one full-screen arcade cabinet. Canvas fills the screen, touch controls float in the corners, cards sit on top. Single dark look by design. */
:root{
  --bg:#0b0a10; --ink:#f3e9d2; --brass:#e8c547; --red:#c8323a; --panel:#17151f; --muted:#a59eb2;
  --display:'Press Start 2P', ui-monospace, Menlo, monospace;
  --body:'VT323', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
.ctl{display:none}
body.touch .ctl{display:block}
#stick{position:fixed;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:128px;height:128px;border-radius:50%;background:rgba(243,233,210,.07);border:2px solid rgba(243,233,210,.25);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(243,233,210,.32);border:2px solid rgba(243,233,210,.5)}
#act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:104px;height:104px;border-radius:50%;background:rgba(200,50,58,.5);border:3px solid rgba(232,197,71,.75);color:var(--ink);font:9px var(--display);letter-spacing:1px;touch-action:none;padding:0}
#act.on{background:rgba(200,50,58,.9);transform:scale(.94)}
#act{z-index:2} /* above the result cards, so the wrench button can always press their GO button */
#mute{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font:8px var(--display);color:var(--muted);background:rgba(11,10,16,.6);border:1px solid rgba(243,233,210,.2);padding:6px 8px;cursor:pointer}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,10,16,.74);padding-block:max(12px, env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));overflow:auto}
#overlay[hidden]{display:none}
body.pad #stick, body.pad #act{display:none}
#overlay.low{place-items:end center;background:linear-gradient(transparent 40%, rgba(11,10,16,.85))}
.card{max-width:560px;width:100%;background:var(--panel);border:3px solid var(--brass);box-shadow:6px 6px 0 #000;padding:16px 20px;display:grid;gap:10px}
.card h1{font:26px/1.2 var(--display);color:var(--brass);margin:0;letter-spacing:2px;text-shadow:3px 3px 0 var(--red);text-wrap:balance}
.card p{font:21px/1.05 var(--body);margin:0;color:var(--ink)}
.card .fine{font-size:18px;color:var(--muted)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
.how li{font:20px/1 var(--body);color:var(--muted)}
.how b{font:9px var(--display);color:var(--ink);display:block;margin-bottom:3px;letter-spacing:1px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button.go{font:13px var(--display);background:var(--red);color:var(--ink);border:3px solid var(--brass);padding:12px 18px;cursor:pointer;box-shadow:4px 4px 0 #000;letter-spacing:1px}
button.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:var(--bg);font:12px/2 var(--display);color:var(--brass);padding:24px}
body.portrait #rotate{display:grid}
#cloud{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,10,16,.86);padding:16px;z-index:20;overflow:auto;touch-action:pan-y}
#cloud[hidden],#cloudbar[hidden]{display:none}
#cloud input,#cloud textarea{-webkit-user-select:text;user-select:text;font:20px var(--body);background:#0b0a10;color:var(--ink);border:2px solid var(--muted);padding:8px 10px;width:100%;box-sizing:border-box}
#cloud input:focus,#cloud textarea:focus{border-color:var(--brass);outline:none}
#cloud .fld{display:grid;gap:4px}
#cloud .fld span{font:9px var(--display);color:var(--muted);letter-spacing:1px}
#cloud #cp{width:8em;letter-spacing:6px}
button.lnk{font:9px var(--display);background:none;border:none;color:var(--muted);padding:10px 4px;cursor:pointer;letter-spacing:1px;text-decoration:underline}
button.go.alt{background:var(--panel)}
button.go:disabled{opacity:.6}
#cloud .lvgrid{display:grid;grid-template-columns:auto repeat(3,52px);gap:8px 10px;align-items:center}
#cloud .lvgrid span{font:10px var(--display);color:var(--ink);letter-spacing:1px}
#cloud .lvgrid button{padding:10px 0}
#cloud .row button.go.alt{font-size:10px;padding:10px 12px}
#cloudbar{position:fixed;display:grid;justify-items:end;gap:6px;z-index:5}
#cloudbar button{font:inherit;font-family:var(--display);color:var(--muted);background:none;border:none;padding:2px 0;cursor:pointer;text-shadow:2px 2px 0 #000}
@media (prefers-reduced-motion: reduce){#act.on{transform:none}}
</style>

// rotating sprites: paint each one once into its own canvas, then draw it turned (snapped to 32 headings so the pixels stay crunchy)
const SP_CV = new Map();
function sprCanvas(rows, pal){
  let byPx = SP_CV.get(rows); if (!byPx){ byPx = {}; SP_CV.set(rows, byPx); }
  if (byPx[PXD]) return byPx[PXD];
  let rr = rows, pp = pal;
  if (PXD === 2){ const hd = HD_SPRITES.get(rows); if (hd){ rr = hd.rows; pp = hdPal(pal, hd); } else rr = scale2x(rows); }
  const c = document.createElement('canvas'); c.width = rr[0].length; c.height = rr.length; const x = c.getContext('2d');
  rr.forEach((row, j) => { for (let i=0; i<row.length; i++){ const ch_ = row[i]; if (ch_ === '.') continue; x.fillStyle = pp[ch_]; x.fillRect(i, j, 1, 1); } });
  return byPx[PXD] = c;
}
function sprRot(rows, pal, x, y, ang, steps = 32, scale = 1){
  const c = sprCanvas(rows, pal), w = c.width/PXD*scale, h = c.height/PXD*scale, k = Math.PI*2/steps;
  b.save(); b.imageSmoothingEnabled = false; b.translate(Math.round(x), Math.round(y)); b.rotate(Math.round(ang/k)*k); b.drawImage(c, -w/2, -h/2, w, h); b.restore();
}

  cloudApply(null);   // the next player on this device starts clean
}
function cloudSave(){ const shop = G.maxUp ? G.maxSaved : G.shopPreview ? G.shopSaved : SHOP; return {shop, best, bestScore}; }
function cloudPush(){ if (!CLOUD.on || !CLOUD.tok) return; clearTimeout(CLOUD.pushT); CLOUD.pushT = setTimeout(cloudPushNow, 1200); }
async function cloudPushNow(keepalive){
  CLOUD.pushT = 0;
  if (!CLOUD.on || !CLOUD.tok) return;
  try { const r = await cloudApi('/api/save', {method:'PUT', body:cloudSave(), keepalive}); if (r.status === 401) cloudForget(); } catch(e) {}
}
window.addEventListener('pagehide', () => { if (CLOUD.pushT){ clearTimeout(CLOUD.pushT); cloudPushNow(true); } });
function cloudRun(ending, reason){
  if (!CLOUD.on || !CLOUD.tok) return;
  cloudApi('/api/run', {method:'POST', body:{ending, reason:reason || '', shift:G.shift, score:G.score, coins:SHOP.coins}}).catch(() => {});
  cloudPush();
}
// every shop save, and every run ending, goes up to the cloud too
const saveShopLocal = saveShop;
saveShop = function(){ saveShopLocal(); if (!G.shopPreview) cloudPush(); };
const toGulagLocal = toGulag;
toGulag = function(reason){
  toGulagLocal(reason);
  if (G.phase !== 'gulag') return;   // went to retirement instead
  cloudRun('gulag', reason);
  const row = overlay.querySelector('.row');
  if (CLOUD.on && row){ row.insertAdjacentHTML('beforeend', '<button class="go alt" id="fbk" type="button">FEEDBACK</button>'); overlay.querySelector('#fbk').onclick = () => cloudFeedback(); }
};
const toRetireLocal = toRetire;
toRetire = function(){ const pv = G.preview; toRetireLocal(); if (!pv) cloudRun('retire'); };
const toAmericaLocal = toAmerica;
toAmerica = function(){ const pv = G.shopPreview; toAmericaLocal(); if (!pv) cloudRun('america'); };

function cloudCard(html){ cloudBox.innerHTML = `<div class="card">${html}</div>`; cloudBox.hidden = false; }
function cloudClose(){ cloudBox.hidden = true; cloudBox.innerHTML = ''; }
function cloudLogin(){
  cloudCard(`<h1>CLOCK IN</h1>
    <p>Pick a name and a 4-digit PIN. Your coins and upgrades save to it, so you can pick up where you left off on any device.</p>
    <label class="fld"><span>NAME</span><input id="cn" maxlength="16" autocomplete="username" autocapitalize="words" spellcheck="false"></label>
    <label class="fld"><span>PIN</span><input id="cp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password"></label>
    <p class="fine" id="cerr">New name? This makes your profile. Coming back? Use the same name and PIN.</p>
    <div class="row"><button class="go" id="cgo" type="button">CLOCK IN</button><button class="lnk" id="cskip" type="button">PLAY WITHOUT SAVING</button></div>`);
  const n = cloudBox.querySelector('#cn'), p = cloudBox.querySelector('#cp'), err = cloudBox.querySelector('#cerr'), go = cloudBox.querySelector('#cgo');
  n.value = CLOUD.name || ''; (n.value ? p : n).focus({preventScroll:true});
  p.addEventListener('input', () => { p.value = p.value.replace(/\D/g, '').slice(0, 4); });
  const submit = async () => {
    if (go.disabled) return;
    go.disabled = true; err.textContent = 'Checking...';
    try {
      const r = await cloudApi('/api/login', {method:'POST', body:{name:n.value, pin:p.value}});
      if (!r.ok){ err.textContent = r.j.error || 'Could not clock in. Try again.'; go.disabled = false; return; }
      CLOUD.tok = r.j.token; CLOUD.name = r.j.name;
      try { localStorage.setItem('wrencher.tok', CLOUD.tok); localStorage.setItem('wrencher.name', CLOUD.name); } catch(e) {}
      const s = r.j.created ? {ok:true, j:{save:null}} : await cloudApi('/api/save');
      cloudApply(s.ok ? s.j.save : null);
      if (r.j.created) cloudPush();
      cloudClose();
    } catch(e){ err.textContent = 'No connection. Try again.'; go.disabled = false; }
  };
  go.onclick = submit;
  [n, p].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
  cloudBox.querySelector('#cskip').onclick = () => { cloudClose(); };
}
function cloudSwitch(){
  if (CLOUD.pushT){ clearTimeout(CLOUD.pushT); cloudPushNow(); }
  const tok = CLOUD.tok;
  if (tok) fetch('/api/logout', {method:'POST', headers:{authorization:'Bearer ' + tok}}).catch(() => {});
  const name = CLOUD.name; cloudForget(); CLOUD.name = name;
  cloudLogin();
}
function cloudFeedback(){
  cloudCard(`<h1>FEEDBACK</h1>
    <p>What was fun, what was confusing, what broke? Anything goes.</p>
    <textarea id="ft" rows="5" maxlength="4000"></textarea>
    <p class="fine" id="ferr">${CLOUD.tok ? 'Sent as ' + CLOUD.name.replace(/[<>&]/g, '') + '.' : 'Sent anonymously.'}</p>
    <div class="row"><button class="go" id="fsend" type="button">SEND</button><button class="lnk" id="fx" type="button">CANCEL</button></div>`);
  const ta = cloudBox.querySelector('#ft'), err = cloudBox.querySelector('#ferr'), send = cloudBox.querySelector('#fsend');
  ta.focus({preventScroll:true});
  send.onclick = async () => {
    if (!ta.value.trim()){ err.textContent = 'Write something first.'; return; }
    send.disabled = true; err.textContent = 'Sending...';
    try {
      const r = await cloudApi('/api/feedback', {method:'POST', body:{text:ta.value, context:{phase:G.phase, shift:G.shift, score:G.score, coins:SHOP.coins, w:innerWidth, h:innerHeight, ua:navigator.userAgent.slice(0, 160)}}});
      if (!r.ok){ err.textContent = r.j.error || 'Could not send. Try again.'; send.disabled = false; return; }
      cloudCard(`<h1>THANK YOU</h1><p>Your note is on the director's desk.</p><div class="row"><button class="go" id="fok" type="button">BACK</button></div>`);
      cloudBox.querySelector('#fok').onclick = cloudClose; cloudBox.querySelector('#fok').focus({preventScroll:true});
    } catch(e){ err.textContent = 'No connection. Try again.'; send.disabled = false; }
  };
  cloudBox.querySelector('#fx').onclick = cloudClose;
}
cloudBar.querySelector('#cbwho').onclick = () => { if (CLOUD.tok) cloudSwitch(); else cloudLogin(); };
cloudBar.querySelector('#cbfb').onclick = () => cloudFeedback();
// the profile line sits under SEE ENDING on the title screen
setInterval(() => {
  const show = CLOUD.on && G.phase === 'attract' && G.flickT < 0 && overlay.hidden && cloudBox.hidden;
  cloudBar.hidden = !show;
  if (!show) return;
  const fs = Math.round(clamp(Math.round(fit*5), 12, 26)*0.6);
  cloudBar.style.fontSize = Math.max(fs, 8) + 'px';
  cloudBar.style.top = Math.round(Math.max(dy0, 0) + 10 + cornerLine()*1.3) + 'px';
  cloudBar.style.right = Math.round(cw - Math.min(dx0 + dw, cw) + 10) + 'px';
  const who = CLOUD.tok ? `${CLOUD.name.toUpperCase()}: SWITCH` : 'CLOCK IN TO SAVE';
  if (cloudBar.querySelector('#cbwho').textContent !== who) cloudBar.querySelector('#cbwho').textContent = who;
}, 200);
(async function cloudBoot(){
  try { const r = await fetch('/api/ping', {cache:'no-store'}); if (!r.ok || !(await r.json()).cloud) return; } catch(e){ return; }
  CLOUD.on = true;
  if (CLOUD.tok){
    try {
      const r = await cloudApi('/api/save');
      if (r.ok){ CLOUD.name = r.j.name; cloudApply(r.j.save); return; }
      if (r.status !== 401) return;   // server hiccup: keep the token and local progress
    } catch(e){ return; }
    const name = CLOUD.name; cloudForget(); CLOUD.name = name;
  }
  cloudLogin();
})();

// ---------- test levels: any round of any level, plus a maxed-out upgrade kit ----------
function setMaxUp(on){
  if (on === !!G.maxUp) return;
  if (on){ G.maxSaved = SHOP; const u = {}; for (const x of UPGRADES) if (x.id !== 'papers') u[x.id] = x.max; SHOP = {coins:SHOP.coins, upg:u}; G.maxUp = true; }
  else { SHOP = G.maxSaved; G.maxSaved = null; G.maxUp = false; }
}
function previewFactory(n){ if (n <= 3) G.nuke = false; ensureAudio(); loadVoices(); musicStop(); G.flickT = -1; G.shift = n; G.score = 0; G.dignity = 100; startShift(); G.factoryPreview = true; }
// the nuclear plant only comes in round 4 on, so its buttons 1/2/3 are rounds 4/5/6
function previewNuke(n){ G.nuke = true; previewFactory(3 + n); }
const TEST_LEVELS = [['FARM', previewFarm], ['FACTORY', previewFactory], ['YUGO LINE', previewYugo], ['MOPED POST', previewMoped], ['COSMODROME', previewSpace], ['NUCLEAR PLANT', previewNuke], ['DENTIST', previewDentist], ['THE QUEUE', previewQueue], ['BOSS FIGHTS', previewBoss]];
function openLevelSelect(){
  ensureAudio();
  cloudCard(`<h1>TEST LEVELS</h1>
    <div class="lvgrid">${TEST_LEVELS.map(([name], i) => `<span>${name}</span>` + [1, 2, 3].map(n => `<button class="go" type="button" data-l="${i}" data-n="${n}">${n}</button>`).join('')).join('')}</div>
    <div class="row"><button class="go alt" type="button" data-x="shop">SHOP</button><button class="go alt" type="button" data-x="ending">ENDING</button><button class="go alt" type="button" data-x="america">AMERICA</button><button class="go alt" type="button" id="lvmax">MAX UPGRADES: ${G.maxUp ? 'ON' : 'OFF'}</button></div>
    <p class="fine">Max upgrades gives every upgrade at full rank for testing. Nothing you earn with it on is saved.</p>
    <div class="row"><button class="lnk" type="button" id="lvx">CLOSE</button></div>`);
  cloudBox.querySelectorAll('[data-l]').forEach(bt => bt.onclick = () => { cloudClose(); TEST_LEVELS[+bt.dataset.l][1](+bt.dataset.n); });
  cloudBox.querySelector('[data-x="shop"]').onclick = () => { cloudClose(); previewShop(); };
  cloudBox.querySelector('[data-x="ending"]').onclick = () => { cloudClose(); previewEnding(); };
  cloudBox.querySelector('[data-x="america"]').onclick = previewAmerica;
  const mx = cloudBox.querySelector('#lvmax');
  mx.onclick = () => { setMaxUp(!G.maxUp); mx.textContent = `MAX UPGRADES: ${G.maxUp ? 'ON' : 'OFF'}`; };
  cloudBox.querySelector('#lvx').onclick = cloudClose;
}

// ---------- loop ----------
resetWorld();
G.phase = 'attract'; overlay.hidden = true;
let last = performance.now();
function frame(now){
  // a slow frame is caught up in up-to-50ms steps instead of slowing the game down (only a real stall, >0.1s, is dropped)
  const dt = Math.min(0.1, (now - last)/1000), steps = Math.ceil(dt/0.05 - 1e-6) || 1; last = now; G.t += dt;
  readInput();
  for (let i = 0; i < steps; i++){ stepPhase(dt/steps); if (i < steps - 1) inp.pressed = false; }
  updateCamera(dt);
  render(G.t);
  inp.pressed = false;
  requestAnimationFrame(frame);
}
function stepPhase(dt){
  // any card with a GO button (round done, title, ...): the wrench button or space presses it too, after a beat so a
  // swing still being mashed from the fight doesn't skip it. The gulag keeps its own longer delay below
  if (inp.pressed && G.phase !== 'gulag' && !overlay.hidden && cloudBox.hidden && G.t - (G.cardT || 0) > 0.6){
    const go = overlay.querySelector('#go'); if (go){ inp.pressed = false; go.click(); }
  }
  if (G.phase === 'play') update(dt);
  else if (G.phase === 'gulag'){ G.gulagT += dt; if (!G.gulagSong && G.gulagT > 1.9){ G.gulagSong = true; musicStart(GULAG_SONG); }
    // space or the wrench button means TRY AGAIN (after a beat, so a mashed button doesn't skip the gulag)
    if (inp.pressed && G.gulagT > 1.2 && cloudBox.hidden){ const go = overlay.querySelector('#go'); if (go) go.click(); }
  }
  else if (G.phase === 'brawlIn' || G.phase === 'brawl') updateBrawl(dt);
  else if (G.phase === 'intro') updateIntro(dt);
  else if (G.phase === 'title') { for (const p of parts) p.life -= dt; }
  else if (G.phase === 'attract') updateAttract(dt);
  else if (G.phase === 'retire') updateRetire(dt);
  else if (G.phase === 'farm') updateFarm(dt);
  else if (G.phase === 'farmIntro') updateFarmIntro(dt);
  else if (G.phase === 'farmEnd') updateFarmEnd(dt);
  else if (G.phase === 'yugo') updateYugo(dt);
  else if (G.phase === 'yugoIntro') updateYugoIntro(dt);
  else if (G.phase === 'yugoEnd') updateYugoEnd(dt);
  else if (G.phase === 'yugoDeath') updateYugoDeath(dt);
  else if (G.phase === 'hub') updateHub(dt);
  else if (G.phase === 'moped') updateMoped(dt);
  else if (G.phase === 'shop') updateShop(dt);
  else if (G.phase === 'america') updateAmerica(dt);
  else if (G.phase === 'mopedRead') updateMopedRead(dt);
  else if (G.phase === 'shiftDone') updateShiftDone(dt);
  else if (G.phase === 'space') updateSpace(dt);
  else if (G.phase === 'spaceEnd') updateSpaceEnd(dt);
  else if (G.phase === 'queue') updateQueue(dt);
  else if (G.phase === 'queueEnd') updateQueueEnd(dt);
  else if (G.phase === 'dent') updateDent(dt);
  else if (G.phase === 'dentIntro') updateDentIntro(dt);
  else if (G.phase === 'dentEnd') updateDentEnd(dt);
}
// read-only handle for the automated playtests in tests/ (they start levels and watch G)
window.__wrencher = {G, levels:TEST_LEVELS, previewShop, previewEnding, shop:() => SHOP, upgrades:UPGRADES, shopBuy, newGame, hubEnter, hubLevels};
if (document.fonts && document.fonts.load) document.fonts.load(`10px ${FONT}`).catch(() => {});
requestAnimationFrame(frame);
})();
</script>
