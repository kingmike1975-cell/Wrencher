<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wrencher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one full-screen arcade cabinet. Canvas fills the screen, touch controls float in the corners, cards sit on top. Single dark look by design. */
:root{
  --bg:#0b0a10; --ink:#f3e9d2; --brass:#e8c547; --red:#c8323a; --panel:#17151f; --muted:#a59eb2;
  --display:'Press Start 2P', ui-monospace, Menlo, monospace;
  --body:'VT323', ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
.ctl{display:none}
body.touch .ctl{display:block}
#stick{position:fixed;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:128px;height:128px;border-radius:50%;background:rgba(243,233,210,.07);border:2px solid rgba(243,233,210,.25);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(243,233,210,.32);border:2px solid rgba(243,233,210,.5)}
#act{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:104px;height:104px;border-radius:50%;background:rgba(200,50,58,.5);border:3px solid rgba(232,197,71,.75);color:var(--ink);font:9px var(--display);letter-spacing:1px;touch-action:none;padding:0}
#act.on{background:rgba(200,50,58,.9);transform:scale(.94)}
#act{z-index:2} /* above the result cards, so the wrench button can always press their GO button */
#mute{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font:8px var(--display);color:var(--muted);background:rgba(11,10,16,.6);border:1px solid rgba(243,233,210,.2);padding:6px 8px;cursor:pointer}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,10,16,.74);padding-block:max(12px, env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));overflow:auto}
#overlay[hidden]{display:none}
body.pad #stick, body.pad #act{display:none}
#overlay.low{place-items:end center;background:linear-gradient(transparent 40%, rgba(11,10,16,.85))}
.card{max-width:560px;width:100%;background:var(--panel);border:3px solid var(--brass);box-shadow:6px 6px 0 #000;padding:16px 20px;display:grid;gap:10px}
.card h1{font:26px/1.2 var(--display);color:var(--brass);margin:0;letter-spacing:2px;text-shadow:3px 3px 0 var(--red);text-wrap:balance}
.card p{font:21px/1.05 var(--body);margin:0;color:var(--ink)}
.card .fine{font-size:18px;color:var(--muted)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
.how li{font:20px/1 var(--body);color:var(--muted)}
.how b{font:9px var(--display);color:var(--ink);display:block;margin-bottom:3px;letter-spacing:1px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button.go{font:13px var(--display);background:var(--red);color:var(--ink);border:3px solid var(--brass);padding:12px 18px;cursor:pointer;box-shadow:4px 4px 0 #000;letter-spacing:1px}
button.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:var(--bg);font:12px/2 var(--display);color:var(--brass);padding:24px}
body.portrait #rotate{display:grid}
#cloud{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,10,16,.86);padding:16px;z-index:20;overflow:auto;touch-action:pan-y}
#cloud[hidden],#cloudbar[hidden]{display:none}
#cloud input,#cloud textarea{-webkit-user-select:text;user-select:text;font:20px var(--body);background:#0b0a10;color:var(--ink);border:2px solid var(--muted);padding:8px 10px;width:100%;box-sizing:border-box}
#cloud input:focus,#cloud textarea:focus{border-color:var(--brass);outline:none}
#cloud .fld{display:grid;gap:4px}
#cloud .fld span{font:9px var(--display);color:var(--muted);letter-spacing:1px}
#cloud #cp{width:8em;letter-spacing:6px}
button.lnk{font:9px var(--display);background:none;border:none;color:var(--muted);padding:10px 4px;cursor:pointer;letter-spacing:1px;text-decoration:underline}
button.go.alt{background:var(--panel)}
button.go:disabled{opacity:.6}
#cloud .lvgrid{display:grid;grid-template-columns:auto repeat(3,52px);gap:8px 10px;align-items:center}
#cloud .lvgrid span{font:10px var(--display);color:var(--ink);letter-spacing:1px}
#cloud .lvgrid button{padding:10px 0}
#cloud .row button.go.alt{font-size:10px;padding:10px 12px}
#cloudbar{position:fixed;display:grid;justify-items:end;gap:6px;z-index:5}
#cloudbar button{font:inherit;font-family:var(--display);color:var(--muted);background:none;border:none;padding:2px 0;cursor:pointer;text-shadow:2px 2px 0 #000}
@media (prefers-reduced-motion: reduce){#act.on{transform:none}}

/* Phaser build: Phaser's canvas at the bottom, the original's text layer (#hud) above it, cards above that.
   Taps that miss a card fall through to the stick and WRENCH button underneath. */
#game{position:fixed;inset:0}
#game canvas{display:block}
#hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#overlay{pointer-events:none;z-index:2}
#overlay > *{pointer-events:auto}
#safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>
</head>
<body>
<div id="game"></div>
<canvas id="hud" aria-label="Wrencher game screen"></canvas>
<div id="safe"></div>
<button id="mute" type="button">SOUND ON</button>
<div id="overlay"></div>
<div id="cloudbar" hidden><button id="cbwho" type="button">CLOCK IN TO SAVE</button><button id="cbfb" type="button">FEEDBACK</button></div>
<div id="cloud" hidden></div>
<div id="rotate">TURN YOUR PHONE<br>SIDEWAYS, COMRADE</div>
<script>
  // iOS: no page zoom or double-tap zoom (the original's guards)
  ['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('#cloud')) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
